name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Format and clippy the fuzz targets
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings

  fuzz-build:
    # The fuzz targets include test modules with `#[path]`, so they can break without any
    # workspace build noticing. Building them catches that; running them is left to developers.
    name: Build fuzz targets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain, nightly and cargo-fuzz
        run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Build the fuzz targets
        run: cargo +nightly fuzz build

  python-lint:
    name: Python lint and types
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: smoke-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Mypy
        run: uv run --locked mypy

  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross and RISC-V binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu \
            binutils-x86-64-linux-gnu \
            binutils-riscv64-unknown-elf
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Unit tests
        run: cargo test --workspace --release
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Smoke tests
        working-directory: smoke-tests
        run: uv run --locked transpiler_smoke_tests.py --platform ${{ matrix.arch }}
