[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
authors = ["Gen Labs"]
edition = "2024"
license = "PolyForm-Small-Business-1.0.0"
repository = "https://github.com/thegridx/gen-transpiler"
rust-version = "1.98.1"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "=4.5.53", features = ["derive", "env"] }
env_logger = { version = "=0.11.8" }
googletest = { version = "=0.14.2" }
log = { version = "=0.4.29" }
object = { version = "=0.37.3" }
rand = { version = "=0.9.2" }
rstest = { version = "=0.26.1" }
rustix = { version = "=1.1.3", features = ["mm", "param", "std"] }
strum = { version = "=0.27.2", default-features = false, features = ["std", "derive"] }
tempfile = { version = "=3.25.0" }
thiserror = { version = "=2.0.17", default-features = false, features = ["std"] }

riscv32 = { path = "crates/riscv32" }
riscv32-elf = { path = "crates/riscv32-elf" }
riscv32-emulator = { path = "crates/riscv32-emulator" }
transpiler = { path = "crates/transpiler" }
user-code-runner = { path = "crates/user-code-runner" }

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
approx_constant = "deny"
as_pointer_underscore = "deny"
as_ptr_cast_mut = "deny"
as_underscore = "deny"
await_holding_lock = "deny"
big_endian_bytes = "deny"
bool_to_int_with_if = "deny"
branches_sharing_code = "deny"
clone_on_ref_ptr = "deny"
comparison_chain = "deny"
default_union_representation = "deny"
doc_link_code = "deny"
doc_link_with_quotes = "deny"
empty_drop = "deny"
equatable_if_let = "deny"
error_impl_error = "deny"
fn_params_excessive_bools = "deny"
format_collect = "deny"
host_endian_bytes = "deny"
ignore_without_reason = "deny"
inconsistent_struct_constructor = "deny"
large_futures = "deny"
large_types_passed_by_value = "deny"
manual_assert_eq = "deny"
manual_ilog2 = "deny"
manual_instant_elapsed = "deny"
manual_is_power_of_two = "deny"
manual_midpoint = "deny"
many_single_char_names = "deny"
match_bool = "deny"
mem_forget = "deny"
needless_pass_by_ref_mut = "deny"
needless_type_cast = "deny"
non_zero_suggestions = "deny"
panic_in_result_fn = "deny"
precedence_bits = "deny"
return_and_then = "deny"
same_functions_in_if_condition = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
should_panic_without_expect = "deny"
significant_drop_in_scrutinee = "deny"
suboptimal_flops = "deny"
suspicious_operation_groupings = "deny"
trailing_empty_array = "deny"
trait_duplication_in_bounds = "deny"
type_repetition_in_bounds = "deny"
undocumented_unsafe_blocks = "deny"
uninlined_format_args = "deny"
unnecessary_box_returns = "deny"
unnecessary_wraps = "deny"
unused_async = "deny"
unused_async_trait_impl = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_bit_mask = "deny"
while_float = "deny"
wildcard_dependencies = "deny"
wildcard_imports = "deny"
wildcard_in_or_patterns = "deny"
with_capacity_zero = "deny"

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "deny"
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
deprecated_safe_2024 = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
if_let_rescope = "deny"
impl_trait_overcaptures = "deny"
impl_trait_redundant_captures = "deny"
keyword_idents = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_unsafe_on_extern = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
tail_expr_drop_order = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unsafe_attr_outside_unsafe = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unstable_features = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"


[profile.release]
panic = "abort"
